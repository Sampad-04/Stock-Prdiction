<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Indian Stock Predictor</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-5">
    <h1 class="text-center mb-4">🇮🇳 Indian Stock Price Predictor</h1>

    <!-- Prediction Section -->
    <div class="card p-4 mb-4 shadow-sm">
      <h4>Predict Next Closing Price</h4>
      <form method="POST" action="/predict" class="row g-3">
        <div class="col-md-8">
          <input type="text" name="ticker" class="form-control" placeholder="Enter NSE Symbol (e.g., RELIANCE or INFY)" required>
        </div>
        <div class="col-md-4">
          <button type="submit" class="btn btn-primary w-100">Predict</button>
        </div>
      </form>
      {% if prediction_text %}
        <div class="alert alert-info mt-3">{{ prediction_text }}</div>
      {% endif %}
    </div>

    <!-- Plotting Section -->
    <div class="card p-4 shadow-sm">
      <h4>Plot Predicted vs Actual</h4>
      <form method="POST" action="/plot" class="row g-3">
        <div class="col-md-8">
          <input type="text" name="ticker_plot" class="form-control" placeholder="Enter NSE Symbol (e.g., TCS)" required>
        </div>
        <div class="col-md-4">
          <button type="submit" class="btn btn-success w-100">Show Graph</button>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
